name: Tests

# tests/: mu300-vpn, its engine drivers, the module's tarballs and its hooks under every shell they run with (dash
# and bash on Ubuntu, busybox ash on OpenWrt). Run them locally with: cd tests && python3 -m unittest discover
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shells and jq
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y -qq dash busybox jq unzip >/dev/null; fi
          if [ "$RUNNER_OS" = macOS ] && ! command -v jq >/dev/null; then brew install jq; fi
          jq --version
      - name: tests
        run: |
          cd tests
          python3 -c 'import helpers; print("shells:", helpers.shells())'
          python3 -m unittest discover -s . -v

  vless-matrix:
    # tools/vless-matrix.sh: every VLESS variant a link can name, as the module writes it for sing-box and for Xray,
    # against a real Xray server on loopback (docs/FINDINGS.md 26o). The pinned engines are linux/arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: engines
        run: |
          sudo apt-get install -y -qq jq curl openssl python3 unzip >/dev/null
          mkdir -p "$RUNNER_TEMP/eng/bin"
          sh tools/fetch-xray.sh "$RUNNER_TEMP/eng"
          sh tools/fetch-sing-box.sh "$RUNNER_TEMP/eng/bin/sing-box"
      - name: matrix
        run: XRAY="$RUNNER_TEMP/eng/bin/xray" SING_BOX="$RUNNER_TEMP/eng/bin/sing-box" sh tools/vless-matrix.sh
